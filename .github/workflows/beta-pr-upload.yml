---
name: Upload Beta for Pull Request

on:
    workflow_run:
        workflows:
            - Build Beta for Pull Request
        types:
            - completed

concurrency:
    group: beta-pr-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
    cancel-in-progress: true

jobs:
    upload:
        if: github.event.workflow_run.conclusion == 'success'
        runs-on: ubuntu-latest

        permissions:
            actions: read
            contents: read

        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: beta-zips
                  run-id: ${{ github.event.workflow_run.id }}
                  github-token: ${{ github.token }}

            - name: Upload Betas
              env:
                  PG_TT_TOKEN: ${{ secrets.PG_TT_TOKEN }}
              run: |
                  PR_NUMBER="$(tr -cd '0-9' < pr.txt)"
                  [ -n "$PR_NUMBER" ] || { echo "No PR number in artifact."; exit 1; }

                  curl --fail -X POST -H "X-API-TOKEN: $PG_TT_TOKEN" -F "branch=pr-$PR_NUMBER" -F "editions=chrome" -F "files=@torntools-chrome.zip;type=application/zip" -F "editions=firefox" -F "files=@torntools-firefox.zip;type=application/zip" https://torntools.tornplayground.eu/api/beta-versions

---
name: Code Quality Checking

on:
    workflow_dispatch:
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    run-checks:
        name: ${{ matrix.check.name }}
        runs-on: ubuntu-latest

        permissions:
            contents: read

        strategy:
            fail-fast: false
            matrix:
                check:
                    - name: Oxlint
                      command: bun oxlint --max-warnings 0
                    - name: Type check
                      command: bun run types
                    - name: Svelte type check
                      command: bun run types:svelte

        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run check
              run: ${{ matrix.check.command }}

name: Prepare next version

on:
    workflow_call:
    workflow_dispatch:

permissions:
    contents: write

jobs:
    prepare:
        runs-on: ubuntu-latest
        environment: Release

        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.repository.default_branch }}

            - uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Prepare next version metadata
              run: |
                  set -euo pipefail
                  newVersion="$(bun tools/prepare-changelog.ts)"

                  # Export version for future tasks
                  echo "newVersion=$newVersion" >> "$GITHUB_ENV"

                  # Change package to next version
                  bun pm version "$newVersion" --force --no-git-tag-version

            - name: Run Oxfmt
              run: bun oxfmt

            - name: Add & Commit
              uses: EndBug/add-and-commit@v10
              with:
                  message: "Prepare next version: v${{ env.newVersion }}"

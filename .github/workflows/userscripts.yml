name: Publish Userscripts

on:
    push:
        branches:
            - master
        paths:
            - "src/userscripts/entries/**/metadata.ts"
    workflow_dispatch:
        inputs:
            entry:
                description: "Only build this single script (folder name, optional)"
                type: string
            beta:
                description: "Build as beta"
                type: boolean
                default: false
            dev:
                description: "Build as dev "
                type: boolean
                default: false

concurrency:
    group: userscripts-${{ github.ref }}
    cancel-in-progress: true

jobs:
    publish:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build userscripts
              run: bun run build:userscripts ${{ inputs.entry }} ${{ inputs.beta && '--beta' }} ${{ inputs.dev && '--dev' }}

            # Upload in batches (a single request with all userscripts is too large), then combine the per-batch responses into one.
            - name: Upload userscripts
              env:
                  PG_TT_TOKEN: ${{ secrets.PG_TT_TOKEN }}
              run: |
                  set -euo pipefail

                  find .output/userscripts -maxdepth 1 -name '*.user.js' -print0 \
                      | xargs -0 -n 20 bash -c '
                          set -euo pipefail
                          upload_args=()
                          for file in "$@"; do
                              upload_args+=(-F "files=@${file};type=application/javascript")
                          done
                          curl --fail -sS -X POST -H "X-API-TOKEN: ${PG_TT_TOKEN}" "${upload_args[@]}" https://torntools.tornplayground.eu/api/userscripts
                      ' _ \
                      | jq -s 'map(.userscripts) | {userscripts: add}' > /tmp/userscripts-response.json

            - name: Write upload summary
              run: |
                  set -euo pipefail

                  response=$(cat /tmp/userscripts-response.json)

                  {
                      echo "## Uploaded userscripts"
                      echo
                      echo "| Namespace | Version | Download | Status |"
                      echo "|-----------|---------|----------|--------|"
                      echo "$response" | jq -r '.userscripts | sort_by(if .status == "created" then 0 elif .status == "updated" then 1 else 2 end, .namespace)[] | "| \(.namespace) | \(.version) | https://torntools.tornplayground.eu/api/userscripts/\(.namespace)/download | \(.status) |"'
                  } >> "${GITHUB_STEP_SUMMARY}"
